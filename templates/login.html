<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş Yap ❤️</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #fff0f3; display: flex; align-items: center; justify-content: center; height: 100vh; font-family: 'Segoe UI', sans-serif; }
        .login-card { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.15); width: 100%; max-width: 400px; text-align: center; }
        .btn-danger { background-color: #ff4d6d; border: none; border-radius: 50px; padding: 12px; font-weight: bold; }
        .form-control { border-radius: 50px; padding: 12px 20px; border: 1px solid #ffccd5; }
    </style>
</head>
<body>
    <div class="login-card">
        <h2 class="text-danger mb-4">Hoş Geldin ❤️</h2>
        <form method="POST">
            <input type="text" name="username" class="form-control mb-3" placeholder="Kullanıcı Adı" required>
            <input type="password" name="password" class="form-control mb-4" placeholder="Şifre" required>
            <button type="submit" class="btn btn-danger w-100">Giriş Yap</button>
        </form>
        {% if error %}<p class="text-danger mt-3 small">{{ error }}</p>{% endif %}
    </div>
</body>
</html>
