{% extends 'base.html' %}

{% block content %}
<style>
    .album-card {
        transition: transform 0.3s;
        border: none;
        border-radius: 15px;
        overflow: hidden;
        box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        text-decoration: none;
        color: inherit;
        display: block;
        background: white;
    }
    .album-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        color: inherit;
    }
    .album-cover {
        height: 200px;
        width: 100%;
        object-fit: cover;
        background-color: #eee;
    }
    .album-info {
        padding: 15px;
        text-align: center;
    }
    .add-album-btn {
        border: 2px dashed #ffccd5;
        background: rgba(255, 255, 255, 0.5);
        height: 100%;
        min-height: 250px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 15px;
        cursor: pointer;
        transition: all 0.3s;
    }
    .add-album-btn:hover {
        background: white;
        border-color: #dc3545;
    }
</style>

<div class="text-center mb-5">
    <h1 class="text-danger fw-bold">📚 Albümlerimiz</h1>
    <p class="text-muted">Anılarımızı klasörledim...</p>
</div>

<div class="row g-4">
    <div class="col-6 col-md-4 col-lg-3">
        <div class="add-album-btn" data-bs-toggle="modal" data-bs-target="#createAlbumModal">
            <div class="text-center text-danger">
                <div class="fs-1">+</div>
                <div class="fw-bold">Yeni Albüm</div>
            </div>
        </div>
    </div>

    {% for album in albums %}
    <div class="col-6 col-md-4 col-lg-3">
        <a href="{{ url_for('view_album', id=album.id) }}" class="album-card h-100">
            {% if album.cover_image %}
                <img src="{{ album.cover_image }}" alt="{{ album.name }}" class="album-cover">
            {% else %}
                <div class="album-cover d-flex align-items-center justify-content-center text-muted">
                    <span>Resim Yok</span>
                </div>
            {% endif %}
            <div class="album-info">
                <h5 class="fw-bold mb-1">{{ album.name }}</h5>
                <small class="text-muted">{{ album.memories|length }} Anı</small>
            </div>
        </a>
    </div>
    {% endfor %}
</div>

<div class="modal fade" id="createAlbumModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Yeni Albüm Oluştur</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <form action="{{ url_for('create_album') }}" method="POST" enctype="multipart/form-data">
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">Albüm İsmi</label>
                        <input type="text" class="form-control" name="name" required placeholder="Örn: Tatiller">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Kapak Fotoğrafı</label>
                        <input type="file" class="form-control" name="cover_image" accept="image/*">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">İptal</button>
                    <button type="submit" class="btn btn-danger">Oluştur</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
